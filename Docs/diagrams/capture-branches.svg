<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t { font-size: 14px; fill: #2b2420; }
      .h { font-size: 18px; font-weight: 700; fill: #2b2420; }
      .s { font-size: 12px; fill: #6b5f58; }
      .box { rx: 14; ry: 14; stroke-width: 1.5; fill: #fff; }
      .arrow { stroke: #8a7a70; stroke-width: 2; fill: none; marker-end: url(#m); }
      .no { stroke: #b23b3b; stroke-width: 2; fill: none; stroke-dasharray: 6 4; marker-end: url(#mr); }
    </style>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a7a70"/></marker>
    <marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b23b3b"/></marker>
  </defs>
  <rect width="1200" height="640" fill="#faf6ef"/>
  <text x="40" y="44" class="h" font-size="26">모습 수집 분기 · CaptureAvailability.detect()</text>
  <text x="40" y="68" class="s">같은 타깃이 visionOS / iOS / iPadOS / macOS 로 빌드된다. 어디서 실행되느냐에 따라 "소반"(상) 또는 "소반 캡처"(촬영)가 뜬다.</text>

  <!-- visionOS -->
  <rect x="40" y="100" width="300" height="200" stroke="#334C85" class="box"/>
  <text x="56" y="128" class="h">Vision Pro (visionOS)</text>
  <text x="56" y="154" class="t">① 사진 보관함 → Vision 분석</text>
  <text x="56" y="176" class="t">② 샘플로 체험</text>
  <text x="56" y="198" class="t">③ 카메라로 촬영 → <tspan fill="#b23b3b">항상 불가</tspan></text>
  <text x="70" y="216" class="s">서드파티 카메라 접근 없음(Enterprise 전용).</text>
  <text x="70" y="232" class="s">Persona 등록식 '벗고 촬영' 은 시스템 전용.</text>
  <text x="56" y="258" class="t">④ 기기에서 받기 → soban-capture 광고</text>
  <text x="56" y="280" class="t">⑤ AirDrop PNG → 사진 보관함 → ①</text>

  <!-- decision -->
  <path d="M340 200 L395 200" class="no"/>
  <rect x="400" y="150" width="240" height="100" stroke="#BD7538" class="box"/>
  <text x="416" y="178" class="h">다른 기기에서 촬영</text>
  <text x="416" y="202" class="t">어떤 카메라가 있나?</text>
  <text x="416" y="224" class="s">AVCaptureDevice.default(…) 로 런타임 판별</text>

  <!-- branches -->
  <path d="M640 170 L695 120" class="arrow"/>
  <path d="M640 200 L695 250" class="arrow"/>
  <path d="M640 230 L695 380" class="arrow"/>

  <rect x="700" y="80" width="460" height="100" stroke="#52856B" class="box"/>
  <text x="716" y="106" class="h" font-size="16">iPhone · iPad — 깊이 카메라 (.depthFront / .depthRear)</text>
  <text x="716" y="128" class="t">전면 TrueDepth 또는 후면 LiDAR · AVCapturePhotoOutput + isDepthDataDeliveryEnabled</text>
  <text x="716" y="148" class="s">깊이 → 얼굴 중앙값 +0.45m 이후 배경 알파 제거(DepthRefiner) · depth.png 저장 · captureSource = .depthCamera</text>
  <text x="716" y="166" class="s">Vision Pro 를 벗고 폰을 거울처럼 들고 안내에 따라 고개를 돌린다.</text>

  <rect x="700" y="210" width="460" height="90" stroke="#C7A95C" class="box"/>
  <text x="716" y="236" class="h" font-size="16">iPhone · iPad — 깊이 없음 (.cameraOnly)</text>
  <text x="716" y="258" class="t">일반 광각 카메라 · 사진만 · Vision 인물 분리로 카드 생성</text>
  <text x="716" y="280" class="s">captureSource = .camera</text>

  <rect x="700" y="340" width="460" height="90" stroke="#8F4D6B" class="box"/>
  <text x="716" y="366" class="h" font-size="16">Mac — FaceTime / 연속성 카메라 (.cameraOnly)</text>
  <text x="716" y="388" class="t">macOS 에는 깊이 전달 API 가 없다 → 사진만</text>
  <text x="716" y="410" class="s">촬영 후 로컬 네트워크로 Vision Pro 에 전송, 또는 ShareLink 로 AirDrop</text>

  <!-- guide -->
  <rect x="40" y="340" width="600" height="180" stroke="#BD7538" class="box"/>
  <text x="56" y="368" class="h">각도 안내 (CaptureGuide) — Persona 등록을 닮은 4단계</text>
  <g class="t">
    <text x="56" y="394">정면  |yaw| &lt; 8°, |pitch| &lt; 10°</text>
    <text x="56" y="416">한쪽으로  14° ≤ |yaw| ≤ 45° (부호 기억)</text>
    <text x="56" y="438">반대쪽으로  같은 범위, 반대 부호</text>
    <text x="56" y="460">살짝 위로  9° ≤ |pitch| ≤ 35°</text>
  </g>
  <text x="56" y="488" class="s">조건이 0.7초 유지되면 자동 촬영. yaw/pitch 는 VNDetectFaceRectanglesRequest(동기) 를 6프레임마다.</text>
  <text x="56" y="506" class="s">정면 사진이 카드가 되고, 나머지는 side-*.png 로 패키지에 보관(v2 입체화용).</text>

  <!-- transfer -->
  <rect x="700" y="460" width="460" height="100" stroke="#334C85" class="box"/>
  <text x="716" y="486" class="h" font-size="16">전송 · soban-capture (MultipeerConnectivity)</text>
  <text x="716" y="508" class="t">Vision Pro = 수신 대기(광고) · 캡처 기기 = 탐색 → 초대 → personaTransfer + PNG</text>
  <text x="716" y="528" class="t">Vision Pro 가 저장 후 personaReceived 응답 → 캡처 기기 "전송 완료"</text>
  <text x="716" y="548" class="s">Wi‑Fi 가 다르면 AirDrop 으로 PNG 를 보내고 사진 보관함에서 가져온다.</text>
  <path d="M640 430 L695 500" class="arrow"/>
</svg>
