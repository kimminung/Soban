<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="-apple-system, 'Apple SD Gothic Neo', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .t { font-size: 14px; fill: #2b2420; }
      .h { font-size: 18px; font-weight: 700; fill: #2b2420; }
      .s { font-size: 12px; fill: #6b5f58; }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#faf6ef"/>
  <text x="40" y="44" class="h" font-size="26">두레반 좌석 배치 · TableLayout (위에서 본 모습, 1 m = 160 px)</text>
  <text x="40" y="68" class="s">이머시브 공간 원점 = 사용자의 발밑. 테이블 중심은 (0, 0, −distance), 기본 1.05 m. 슬롯 0 은 항상 "나".</text>

  <!-- top view -->
  <g transform="translate(360,360)">
    <!-- mat -->
    <circle cx="0" cy="0" r="262" fill="#e9dcc3" opacity=".6"/>
    <!-- cushions -->
    <g font-size="13" fill="#2b2420" text-anchor="middle">
      <circle cx="0" cy="168" r="40" fill="#334C85"/><text x="0" y="173" fill="#fff" font-weight="700">0 · 나</text>
      <circle cx="145" cy="84" r="40" fill="#BD7538"/><text x="145" y="89" fill="#fff" font-weight="700">1</text>
      <circle cx="145" cy="-84" r="40" fill="#52856B"/><text x="145" y="-79" fill="#fff" font-weight="700">2</text>
      <circle cx="0" cy="-168" r="40" fill="#8F4D6B"/><text x="0" y="-163" fill="#fff" font-weight="700">3</text>
      <circle cx="-145" cy="-84" r="40" fill="#C7A95C"/><text x="-145" y="-79" fill="#fff" font-weight="700">4</text>
      <circle cx="-145" cy="84" r="40" fill="#666185"/><text x="-145" y="89" fill="#fff" font-weight="700">5</text>
    </g>
    <!-- table -->
    <circle cx="0" cy="0" r="99" fill="#4d2b1a" stroke="#2f1b11" stroke-width="4"/>
    <circle cx="0" cy="0" r="26" fill="#8c9ea8" opacity=".8"/>
    <!-- cups -->
    <g fill="#ece8dd" stroke="#bbb">
      <circle cx="0" cy="77" r="6"/><circle cx="66" cy="38" r="6"/><circle cx="66" cy="-38" r="6"/><circle cx="0" cy="-77" r="6"/><circle cx="-66" cy="-38" r="6"/><circle cx="-66" cy="38" r="6"/>
    </g>
    <circle cx="29" cy="-8" r="12" fill="#595550"/>
    <circle cx="-32" cy="13" r="17" fill="#e1ddd2"/>
    <!-- user origin -->
    <g transform="translate(0,168)">
      <path d="M0,-60 L-8,-44 L8,-44 Z" fill="#334C85"/>
      <text x="56" y="4" class="s">▲ 사용자 시선(−z)</text>
    </g>
    <!-- dims -->
    <line x1="0" y1="0" x2="0" y2="168" stroke="#2b2420" stroke-dasharray="4 3"/>
    <text x="8" y="120" class="s">seatRadius 1.05 m</text>
    <line x1="0" y1="0" x2="99" y2="0" stroke="#f3e9dc" stroke-dasharray="4 3"/>
    <text x="104" y="-30" class="s">tableRadius 0.62 m</text>
  </g>

  <!-- side view -->
  <g transform="translate(760,120)">
    <text x="0" y="0" class="h">옆에서 본 높이 (m)</text>
    <rect x="0" y="20" width="400" height="330" fill="#fff" stroke="#d9cfc4" rx="10"/>
    <!-- floor -->
    <line x1="20" y1="330" x2="380" y2="330" stroke="#8a7a70" stroke-width="2"/><text x="330" y="346" class="s">바닥 y = 0</text>
    <!-- table -->
    <rect x="120" y="282" width="160" height="6" fill="#4d2b1a"/><rect x="140" y="288" width="8" height="42" fill="#3b2114"/><rect x="252" y="288" width="8" height="42" fill="#3b2114"/>
    <text x="290" y="286" class="s">상판 0.30</text>
    <!-- cushion -->
    <rect x="30" y="322" width="80" height="8" fill="#334C85" rx="3"/><text x="30" y="316" class="s">방석 0.05</text>
    <!-- persona card -->
    <rect x="40" y="130" width="60" height="128" fill="#8fb3d9" opacity=".5" stroke="#334C85"/>
    <text x="106" y="262" class="s">카드 아랫변 personaBaseY 0.34</text>
    <text x="106" y="136" class="s">카드 윗변 1.14 (높이 0.8)</text>
    <circle cx="70" cy="160" r="4" fill="#334C85"/><text x="106" y="164" class="s">피벗 = 얼굴 중심 → 고개 회전축</text>
    <!-- head -->
    <circle cx="340" cy="140" r="14" fill="#2b2420"/><text x="300" y="118" class="s">내 머리 ≈ 1.2 (앉음)</text>
    <line x1="326" y1="140" x2="110" y2="150" stroke="#8a7a70" stroke-dasharray="4 3"/>
    <text x="150" y="110" class="s">시선 → 맞은편 페르소나 눈높이</text>
  </g>

  <text x="760" y="500" class="t" font-weight="700">슬롯 회전</text>
  <text x="760" y="524" class="t" font-family="Menlo, monospace" font-size="13">slot = ((seat − mySeat) mod 6 + 6) mod 6</text>
  <text x="760" y="548" class="s">예) 내 좌석 2, 상대 좌석 0 → 상대는 내 화면에서 슬롯 4(왼쪽 뒤)에 보인다.</text>
  <text x="760" y="568" class="s">각 기기는 자기만의 회전으로 그리지만, 상대적 자리 관계(누가 누구 옆인지)는 모두 동일하다.</text>
  <text x="760" y="600" class="t" font-weight="700">공간 음향</text>
  <text x="760" y="622" class="s">AVAudioEnvironmentNode 리스너 = 내 머리, 소스 = 각 슬롯의 페르소나 위치 (HRTF HQ).</text>
</svg>
